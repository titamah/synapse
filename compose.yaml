# Cap each container's logs at ~30 MB (3 files x 10 MB), keeping the most recent.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build: .
    logging: *logging
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Web server port, reachable only inside Docker's network (by the tunnel), never published on the VM.
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy

  # Cloudflare Tunnel: connects out to Cloudflare so api.bostonblerds.com reaches the bot's web server
  # without opening any ports. Only runs where COMPOSE_PROFILES=tunnel is set (the production .env).
  tunnel:
    image: cloudflare/cloudflared:latest
    logging: *logging
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - bot
    profiles: ["tunnel"]

  db:
    image: postgres:18
    logging: *logging
    restart: unless-stopped
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Reachable from this machine only (for `npm run dev` and backups), never the internet.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis comes back when activity aggregation does (see Synapse roadmap).

volumes:
  db-data:
